name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (root module)
        run: go build ./...

      - name: Tests (root module)
        run: go test ./... -count=1

      - name: Vet (static analysis, root + integration)
        run: |
          go vet ./...
          cd integration
          go vet ./...

      - name: gofmt check (root + integration)
        run: |
          set -e
          if [ -n "$(gofmt -s -l . | grep -v '^integration[/\\]')" ]; then
            echo "Unformatted files in root module:"
            gofmt -s -l . | grep -v '^integration[/\\]' || true
            exit 1
          fi
          if [ -n "$(gofmt -s -l integration/)" ]; then
            echo "Unformatted files in integration module:"
            gofmt -s -l integration/
            exit 1
          fi

      - name: Check no hardcoded local paths leak
        run: |
          set -e
          if grep -rn "E:\\\\laragon\|C:\\\\Users\\\\MohamedSheta" --include="*.go" .; then
            echo "Hardcoded local path found in Go sources — use portable defaults." >&2
            exit 1
          fi

      - name: Staticcheck (deep static analysis + style lint)
        if: runner.os == 'Windows'
        run: |
          set -e
          # Same transient sumdb/proxy flakes as the release workflow — retry.
          for i in 1 2 3 4 5; do
            if go install honnef.co/go/tools/cmd/staticcheck@latest; then
              break
            fi
            if [ "$i" = 5 ]; then echo "staticcheck install failed after 5 attempts" >&2; exit 1; fi
            echo "staticcheck install attempt $i failed — retrying in $((i * 15))s…"
            sleep $((i * 15))
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Staticcheck — bug detection
        if: runner.os == 'Windows'
        run: staticcheck ./...

      - name: Style lint
        if: runner.os == 'Windows'
        # Default checks only (same as bug detection above). The style
        # checks ("all") flag the stable public API names (ToSql, GetSql,
        # DialectMySql, ...), which must not be renamed.
        run: staticcheck ./...

  # --------------------------------------------------------------------------------------
  # Integration tests: same suite against EVERY database.
  # sqlite needs no service; mysql/mariadb/postgres/sqlserver run as services.
  # XQB_REQUIRE_ALL=1 makes a missing DB fail instead of skip.
  # --------------------------------------------------------------------------------------
  integration:
    name: Integration tests (all dialects)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_xqb_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: test_xqb_db
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_xqb_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test_xqb_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Strong!Pass123
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Strong!Pass123' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      XQB_MYSQL_DSN: test:test@tcp(127.0.0.1:3306)/test_xqb_db?parseTime=true&multiStatements=true&charset=utf8mb4
      XQB_MARIADB_DSN: test:test@tcp(127.0.0.1:3307)/test_xqb_db?parseTime=true&multiStatements=true&charset=utf8mb4
      XQB_POSTGRES_DSN: postgres://test:test@127.0.0.1:5432/test_xqb_db?sslmode=disable
      # master avoids a CREATE DATABASE step; tables are test-prefixed (xqb_*).
      XQB_SQLSERVER_DSN: sqlserver://sa:Strong!Pass123@127.0.0.1:1433?database=master
      XQB_REQUIRE_ALL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install DB clients (for readiness probes)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client postgresql-client

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Wait for MariaDB
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3307 -u root -proot --silent; do
            echo "Waiting for MariaDB..."
            sleep 2
          done

      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U test; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      - name: Wait for SQL Server (TCP)
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1; then
              echo "SQL Server TCP is up"
              break
            fi
            echo "Waiting for SQL Server..."
            sleep 2
          done

      - name: Run integration tests (all dialects)
        working-directory: integration
        run: go test -v -count=1 ./...

  # --------------------------------------------------------------------------------------
  # Security checks scan
  # --------------------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Gosec Security Checker
        uses: securego/gosec@v2.22.4

      - name: Run govulncheck (root + integration)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          cd integration
          govulncheck ./...
